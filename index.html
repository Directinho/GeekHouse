<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeekHouse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="./css/cabecalho.css">
    <link rel="stylesheet" href="./css/banner.css">
    <link rel="stylesheet" href="./css/categorias.css">
    <link rel="stylesheet" href="./css/promocoes.css">
    <link rel="stylesheet" href="./css/newsletter.css">
    <link rel="stylesheet" href="./css/rodape.css">
</head>

<body>

    <header class="cabecalho">
        <nav class="cabecalho_nav">
            <ul class="cabecalho_nav_list">
                <li>
                    <h1 class="cabecalho_logo">
                        <img src="/assets/icons/logo.svg" alt="logo do GeekHouse">
                    </h1>
                </li>
                <li class="cabecalho_nav_list_item">
                    <a href="#" class="cabecalho_nav_item_link">
                        Sobre Nós
                    </a>
                </li>
                <li class="cabecalho_nav_list_item_input">
                    <input type="search" id="search" placeholder="O que você procura?" class="cabecalho_nav_list_input">
                </li>
                <li class="cabecalho_nav_item_link">
                    <a href="#" class="cabecalho_nav_item_link">
                        Login
                    </a>
                <li class="cabecalho_nav_list_item">
                    <a href="#" class="cabecalho_nav_list_link_perfil">
                        <img src="./assets/icons/perfil.svg" alt="perfil">
                    </a>

                </li>
                <li class="cabecalho_nav_list_item">
                    <a href="#" class="cabecalho_nav_list_link_carrinho">
                        <img src="./assets/icons/carrinho.svg" alt="Carrinho">
                    </a>

                </li>
                </li>
            </ul>
        </nav>
    </header>
