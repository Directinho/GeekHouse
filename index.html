<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeekHouse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="./css/cabecalho.css">
    <link rel="stylesheet" href="./css/banner.css">
    <link rel="stylesheet" href="./css/categorias.css">
    <link rel="stylesheet" href="./css/promocoes.css">
    <link rel="stylesheet" href="./css/newsletter.css">
    <link rel="stylesheet" href="./css/rodape.css">
</head>

<body>

    <header class="cabecalho">
        <nav class="cabecalho_nav">
            <ul class="cabecalho_nav_list">
                <li>
                    <h1 class="cabecalho_logo">
                        <img src="/assets/icons/logo.svg" alt="logo do GeekHouse">
                    </h1>
                </li>
                <li class="cabecalho_nav_list_item">
                    <a href="#" class="cabecalho_nav_item_link_sobre">
                        Sobre Nós
                    </a>
                </li>
                <li class="cabecalho_nav_list_item_input">
                    <input type="search" id="search" placeholder="O que você procura?" class="cabecalho_nav_list_input">
                    <img src="./assets/icons/search.svg" class="lupa" alt="lupa">
                </li>
                <li class="cabecalho_nav_item_link">
                    <a href="#" class="cabecalho_nav_item_link">
                        Login
                    </a>
                <li class="cabecalho_nav_list_item">
                    <a href="#" class="cabecalho_nav_list_link_perfil">
                        <img src="./assets/icons/perfil.svg" alt="perfil">
                    </a>

                </li>
                <li class="cabecalho_nav_list_item">
                    <a href="#" class="cabecalho_nav_list_link_carrinho">
                        <img src="./assets/icons/carrinho.svg" alt="Carrinho">
                    </a>

                </li>
                </li>
            </ul>
        </nav>
    </header>
    <section class="banner">
        <img src="./assets/banner.png" class="banner_imagem" alt="Pessoa utilizando roupa da GeekHouse"/>
        <div class="banner_container">
            <h2 class="banner_container_titulo">Hora de abraçar<span> o seu lado geek!</span></h2>
            <button class="banner_container_botao">Ver as Novidades!</button>
        </div>
    </section>
    <section class="categorias">
        <h3 class="categorias_titulo">Categorias</h3>
        <p class="categorias_texto">De roupas e gadgets tecnológicos temos tudo para atender suas paixões e hobbies com estilo e autenticidade</p>
        <ul class="categorias_list">
            <li class="categorias_list_item_categorias_list_item_roupa">
                <div class="categorias_list_item_container">
                    <img src="./assets/roupas.png" alt="Roupas"/>
                </div>
                <h4 class="categorias_list_item_titulo">
                    Roupas
                </h4>

            </li>
            <li class="categorias_list_item_categorias_decoracao">
                <div class="categorias_list_item_container">
                    <img src="./assets/decoracao.png" alt="Decoração">
                </div>
                <h4 class="categorias_list_item_titulo">
                    Decoração
                </h4>
            </li>
                 <li class="categorias__list_item_canecas">
                        <div class="categorias_list_item_container">
                                <img src="./assets/canecas.png" alt="Canecas"/>
                        </div>
                        <h4 class="categorias_list_item_titulo">Canecas</h4>
                </li> 
                <li class="categorias__list_item_acessorios">
                        <div class="categorias_list_item_container">
                                <img src="./assets/acessorios.png" alt="Acessorios"/>
                        </div>
                        <h4 class="categorias_list_item_titulo">Acessorios</h4>
                </li> 
            </div>
        </ul>
    </section>
</body>

</html>
